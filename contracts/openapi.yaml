openapi: 3.1.0
info:
  title: junction-2026 game server
  version: "1.0.0"
  description: |
    REST contract. Base path /api. Frozen at G0; additive changes only.
    Frames are 64 strings of 64 lowercase hex chars (row 0 at top), palette in contracts/palette.json.
    Model-facing responses (POST /sessions, POST /sessions/{id}/act) are pixels only: no state, score or rule names.
    Trace and derived shapes: contracts/trace.schema.json, contracts/derived.schema.json.
servers:
  - url: /api
paths:
  /health:
    get:
      summary: Liveness + versions
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  engine: {type: string, description: "engine package in use: engine | fake"}
                  engine_version: {type: string}
                  published_mode: {type: boolean}
  /collections:
    get:
      summary: Names of available collections
      responses:
        "200":
          description: list
          content:
            application/json:
              schema: {type: array, items: {type: string}}
  /games:
    get:
      summary: Game catalogue (gallery)
      parameters:
        - {name: collection, in: query, required: false, schema: {type: string, default: dev}}
      responses:
        "200":
          description: list of game metadata
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/GameMeta"}
  /challenge/score:
    post:
      summary: Put a finished human run on the "Can you beat the AI?" visitor board. Allowed in published mode.
      description: |
        The score is read from the recorded run, never from the client: levels_completed, levels_total, actions, outcome.
        Only human runs that have ended (not IN_PROGRESS). One board row per run (409 on repeat).
        `name` is cleaned to <= 24 printable characters; links are rejected (422). 6 posts per client per minute (429).
        Stored in DATA_DIR/challenge/board.jsonl, apart from research runs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [run_id, name]
              properties:
                run_id: {type: string}
                name: {type: string, maxLength: 64}
                beat_ai: {type: boolean, default: false, description: "client's verdict vs the model runs it showed; display only"}
      responses:
        "200":
          description: Row as stored, with its rank on that game's board
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChallengeRow"}
        "403": {description: not a human run}
        "404": {description: unknown run}
        "409": {description: run still in progress, or already on the board}
        "422": {description: unusable name}
        "429": {description: rate limited}
  /challenge/board:
    get:
      summary: Visitor board, best first (more levels, then fewer actions, then earlier)
      parameters:
        - {name: game_id, in: query, schema: {type: string}, description: "one game's board; omit for all games"}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        "200":
          description: Top rows plus totals
          content:
            application/json:
              schema:
                type: object
                properties:
                  game_id: {type: string, nullable: true}
                  rows: {type: array, items: {$ref: "#/components/schemas/ChallengeRow"}}
                  plays: {type: integer}
                  wins: {type: integer}
                  beat_ai: {type: integer}
  /games/generate:
    post:
      summary: Generate a new verified game on demand (procedural factory). CPU only, allowed in published mode.
      description: |
        No seed -> random seed in 1000000-9999999 (outside train 100000-899999 and eval 900000-999999).
        Seeds 900000-999999 need the admin bearer token (eval leak guard). Same seed + settings -> same game_id.
        The returned game_id works with every other route (GET /games/{id}, POST /sessions, thumbnail).
        Recently generated games are listed by GET /games?collection=generated.
        Rate limit 30 per minute per client (429); 503 when the generator is saturated.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                seed: {type: integer, minimum: 0, nullable: true}
                difficulty: {type: integer, minimum: 1, maximum: 4, default: 2}
                n_levels: {type: integer, minimum: 3, maximum: 8, default: 6}
      responses:
        "200":
          description: "GameMeta plus seed, difficulty, n_levels; collection = generated"
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: "#/components/schemas/GameMeta"}
                  - type: object
                    properties:
                      seed: {type: integer}
                      n_levels: {type: integer}
        "403": {description: eval seed without admin token}
        "422": {description: invalid settings, or no valid game for this seed}
        "429": {description: rate limited}
        "503": {description: generator busy}
  /games/{game_id}:
    get:
      summary: Full describe() output. Contains the truth; UI only.
      parameters:
        - {name: game_id, in: path, required: true, schema: {type: string}}
        - {name: collection, in: query, required: false, schema: {type: string}}
      responses:
        "200":
          description: description
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Description"}
        "404": {description: unknown game}
  /games/{game_id}/ghosts:
    get:
      summary: Ghost race data for one level - best recorded runs as step slices, plus the optimal BFS ghost
      description: |
        One ghost per player (its best attempt on the level): solved first, then fewest actions on the level.
        Take-over runs (meta.start_level) are never ghosts. Responses are gzip-compressed (~20x).
        A level's slice holds every action taken while on that level, including RESETs; the action that completes
        the level is the last one (its frame already shows the next level). start_frame = frame when the level began.
      parameters:
        - {name: game_id, in: path, required: true, schema: {type: string}}
        - {name: level, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: limit, in: query, schema: {type: integer, minimum: 0, maximum: 10, default: 3}}
        - {name: kind, in: query, schema: {type: string, default: model}, description: "comma list of model,baseline,human"}
        - {name: optimal, in: query, schema: {type: boolean, default: true}}
        - {name: frames, in: query, schema: {type: boolean, default: true}}
        - {name: reasoning, in: query, schema: {type: integer, minimum: 0, maximum: 4000, default: 0}, description: "chars of reasoning per step (0 = omit)"}
        - {name: collection, in: query, schema: {type: string}}
      responses:
        "200":
          description: ghosts
          content:
            application/json:
              schema:
                type: object
                properties:
                  game_id: {type: string}
                  level: {type: integer}
                  optimal: {$ref: "#/components/schemas/Ghost"}
                  ghosts: {type: array, items: {$ref: "#/components/schemas/Ghost"}}
        "404": {description: unknown game}
  /rules/img/{name}:
    get:
      summary: "Rule teaching images from rules/img/ (<rule>.png swatch sheet, <rule>.gif optimal solution)"
      parameters:
        - {name: name, in: path, required: true, schema: {type: string, pattern: "^[a-z0-9_]+\\.(png|gif)$"}}
      responses:
        "200": {description: image}
        "404": {description: not found}
  /games/{game_id}/thumbnail.png:
    get:
      summary: PNG of level 1 initial frame
      parameters:
        - {name: game_id, in: path, required: true, schema: {type: string}}
        - {name: level, in: query, required: false, schema: {type: integer, default: 1}}
      responses:
        "200":
          description: png
          content:
            image/png: {}
  /sessions:
    post:
      summary: Start a game session (opens a run)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [player]
              properties:
                game_id: {type: string, description: "required unless takeover_of is given"}
                collection: {type: string, nullable: true}
                player: {$ref: "#/components/schemas/Player"}
                start_level: {type: integer, minimum: 1, nullable: true, description: "start at this level (take-over / practice); recorded as meta.start_level, excluded from baselines"}
                takeover_of:
                  type: object
                  nullable: true
                  description: "take over a recorded run: server uses that run's game and the level it was on at `step` (level start, not mid-level state); recorded as meta.takeover_of"
                  properties:
                    run_id: {type: string}
                    step: {type: integer, minimum: 0}
                run_key: {type: string, nullable: true, description: "idempotency key; an existing finished run with this key returns 409"}
                harness_version: {type: string, nullable: true}
      responses:
        "200":
          description: session started
          content:
            application/json:
              schema:
                type: object
                required: [session_id, run_id, frame, available_actions]
                properties:
                  session_id: {type: string}
                  run_id: {type: string}
                  frame: {$ref: "#/components/schemas/Frame"}
                  available_actions: {type: array, items: {$ref: "#/components/schemas/Action"}}
        "404": {description: unknown game}
        "409": {description: run_key already has a finished run}
  /sessions/{session_id}/act:
    post:
      summary: Take one action. Pixels only in the response.
      parameters:
        - {name: session_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {$ref: "#/components/schemas/Action"}
                x: {type: integer, minimum: 0, maximum: 63, nullable: true}
                y: {type: integer, minimum: 0, maximum: 63, nullable: true}
                reasoning: {type: string, nullable: true}
                hypothesis: {type: string, nullable: true}
                belief: {enum: [playing, won, lost], nullable: true}
                usage: {$ref: "#/components/schemas/Usage"}
                latency_ms: {type: integer, nullable: true}
      responses:
        "200":
          description: new frame
          content:
            application/json:
              schema:
                type: object
                required: [frame, available_actions]
                properties:
                  frame: {$ref: "#/components/schemas/Frame"}
                  available_actions: {type: array, items: {$ref: "#/components/schemas/Action"}}
        "404": {description: unknown session}
        "409": {description: session already ended}
        "422": {description: invalid action}
  /sessions/{session_id}/truth:
    get:
      summary: Hidden truth. Harness and human debug overlay only; never shown to a model.
      parameters:
        - {name: session_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: truth
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Truth"}
  /sessions/{session_id}/end:
    post:
      summary: Close the run
      parameters:
        - {name: session_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string, description: "free text; 'budget' sets outcome BUDGET"}
                outcome: {enum: [WIN, GAME_OVER, BUDGET, ABORTED], nullable: true, description: "optional override; default derived from truth"}
                usage_total: {$ref: "#/components/schemas/Usage"}
      responses:
        "200":
          description: final run meta
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RunMeta"}
  /runs:
    get:
      summary: Run metas, newest first
      parameters:
        - {name: game_id, in: query, schema: {type: string}}
        - {name: model_id, in: query, schema: {type: string}}
        - {name: kind, in: query, schema: {enum: [human, model, baseline]}}
        - {name: collection, in: query, schema: {type: string}}
        - {name: run_key, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, default: 500}}
      responses:
        "200":
          description: list
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/RunMeta"}}
  /runs/export:
    get:
      summary: tar.gz of finished run folders (meta.json + steps.jsonl) ended since `since`
      parameters:
        - {name: since, in: query, required: false, schema: {type: string, format: date-time}}
      responses:
        "200":
          description: archive
          content:
            application/gzip: {}
  /runs/{run_id}:
    get:
      summary: Run meta
      parameters:
        - {name: run_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: meta
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RunMeta"}
  /runs/{run_id}/steps:
    get:
      summary: All steps of a run (replay)
      parameters:
        - {name: run_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: steps
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Step"}}
  /derived/{name}.json:
    get:
      summary: File from data/derived/ (or data/published/ in published mode, falling back to data/fixtures/derived/)
      parameters:
        - {name: name, in: path, required: true, schema: {enum: [leaderboard, rules, insights]}}
      responses:
        "200": {description: json per contracts/derived.schema.json}
        "404": {description: not built yet}
  /admin/rebuild:
    post:
      summary: Run `analysis build` on the shared host
      security: [{adminToken: []}]
      responses:
        "200": {description: rebuilt}
        "401": {description: bad token}
  /live:
    get:
      summary: "WebSocket (upgrade). Messages: {run_id, step} for every recorded step, plus {run_id, event: started|ended, meta}"
      responses:
        "101": {description: switching protocols}
components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
  schemas:
    ChallengeRow:
      type: object
      properties:
        run_id: {type: string}
        game_id: {type: string}
        name: {type: string}
        levels_completed: {type: integer}
        levels_total: {type: integer}
        actions: {type: integer}
        outcome: {type: string}
        beat_ai: {type: boolean}
        at: {type: string, format: date-time}
        rank: {type: integer}
    Frame:
      type: array
      minItems: 64
      maxItems: 64
      items: {type: string, pattern: "^[0-9a-f]{64}$"}
    Action:
      enum: [RESET, ACTION1, ACTION2, ACTION3, ACTION4, ACTION5, ACTION6, ACTION7]
    Player:
      type: object
      required: [kind, name]
      properties:
        kind: {enum: [human, model, baseline]}
        name: {type: string}
        model_id: {type: string, nullable: true}
        provider: {type: string, nullable: true}
        effort: {type: string, nullable: true}
    Usage:
      type: object
      nullable: true
      properties:
        in: {type: integer}
        out: {type: integer}
        cost_usd: {type: number}
    Truth:
      $ref: "trace.schema.json#/$defs/truth"
    RunMeta:
      $ref: "trace.schema.json#/$defs/meta"
    Step:
      $ref: "trace.schema.json#/$defs/step"
    Ghost:
      type: object
      nullable: true
      properties:
        run_id: {type: string, nullable: true, description: "null for the optimal ghost"}
        player: {$ref: "#/components/schemas/Player"}
        solved: {type: boolean}
        actions: {type: integer, description: "actions taken on this level"}
        first_step: {type: integer, description: "step index i of the first action on this level in the run"}
        start_frame: {$ref: "#/components/schemas/Frame"}
        steps:
          type: array
          items:
            type: object
            properties:
              i: {type: integer}
              action: {$ref: "#/components/schemas/Action"}
              events: {type: array, items: {type: string}}
              state: {type: string}
              hypothesis: {type: string, nullable: true}
              belief: {type: string, nullable: true}
              reasoning: {type: string, nullable: true}
              frame: {$ref: "#/components/schemas/Frame"}
    GameMeta:
      type: object
      required: [game_id, levels_total, thumbnail_url]
      properties:
        game_id: {type: string}
        collection: {type: string}
        spec: {type: object}
        engine_version: {type: string}
        levels_total: {type: integer}
        difficulty: {type: integer}
        rules: {type: array, items: {type: string}, description: "union of rules across levels"}
        rules_per_level: {type: array, items: {type: array, items: {type: string}}}
        optimal_moves_total: {type: integer}
        thumbnail_url: {type: string}
    Description:
      type: object
      required: [game_id, spec, engine_version, levels_total, levels, available_actions]
      properties:
        game_id: {type: string}
        spec: {type: object}
        engine_version: {type: string}
        levels_total: {type: integer}
        available_actions: {type: array, items: {$ref: "#/components/schemas/Action"}}
        levels:
          type: array
          items:
            type: object
            properties:
              level: {type: integer}
              rules: {type: array, items: {type: string}}
              new_rule: {type: string, nullable: true}
              move_budget: {type: integer}
              optimal_moves: {type: integer}
              optimal_path: {type: array, items: {$ref: "#/components/schemas/Action"}}
