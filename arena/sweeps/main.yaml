# Main sweep on frozen eval-v1, harness h1. Shared server only.
#   python -m arena run arena/sweeps/main.yaml --api shared --approve-cost 120
# Claude rows: see main-opus.yaml. DeepSeek: see main-deepseek.yaml (Featherless concurrency makes 30x3 too slow).
name: main
collection: eval-v1
games: all
attempts: 3            # AfterQuery judges rerun 3 agent runs; we report mean and spread
concurrency: 24
est_steps_per_game: 250
models:
  - {id: gemini-flash, effort: medium, max_concurrency: 20}
baselines: [random, optimal, noop, stop_early]
budgets: {max_actions: 400, max_turns: 500, max_cost_usd: 2.00, max_wall_s: 10800}
