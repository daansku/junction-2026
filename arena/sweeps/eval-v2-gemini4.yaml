# Gemini 4 Argon + Carbon on all 30 eval-v2 games x 1.
# Same harness and budgets as eval-v2-frontier / the eval-v1 main sweep (h1, medium, 400 actions, 3 h wall) so the
# boards compare. $15/run cap so cost never cuts a run short (the earlier Argon eval-v2 runs in main-subset-argon-v2 /
# challenge-argon-v2 were cut at $4: these are the runs that count).
# ~13 s/action -> ~90 min per 400-action game; Carbon is slower (~2.3 actions/min). Runs interrupted by a restart
# end as idle_timeout and are dropped by the analysis.
name: eval-v2-gemini4
collection: eval-v2
games: all
attempts: 1
concurrency: 24
est_steps_per_game: 350
models:
  - {id: gemini-4-argon, effort: medium, max_concurrency: 8}
  - {id: gemini-4-carbon, effort: medium, max_concurrency: 16}
budgets: {max_actions: 400, max_turns: 500, max_cost_usd: 15.00, max_wall_s: 10800}
