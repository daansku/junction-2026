# Overnight Sat 14.11 (human request, option B in coordination/OVERNIGHT.md): real model traces on `dev`
# before the 11:00 eval-v1 freeze, recorded to a server on A4's machine (port 8100, DATA_DIR
# ~/junction-overnight) because the shared server runs a stale engine. Copied to the shared server in
# the morning. Dev-only: never mixes with the eval-v1 leaderboard.
# Sized from the 03:50 smoke: 10-30 s per action, so 150 actions per run and 4 games x 2 attempts
# finish by ~08:00. Qwen3.5-9B dropped (50 s per action, would not finish).
name: overnight-dev
collection: dev
games: {first: 4}
attempts: 2
concurrency: 40           # pool > total runs: tasks wait on per-model max_concurrency, not on pool slots
est_steps_per_game: 150
models:
  - {id: verda-kimi-k3-1-pro}
  - {id: nemotron-3-5-super-vl}
  - {id: featherless-open}
  - {id: featherless-gpt-oss-120b}
baselines: [random, optimal, noop, stop_early]
budgets: {max_actions: 150, max_turns: 200, max_cost_usd: 1.00, max_wall_s: 5400}
