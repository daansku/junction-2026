# eval-v2 Gemini Flash, uncapped, so no cost cap cuts a run short.
# Replaces the Gemini part of eval-v2-frontier.yaml, whose $2/run cap stopped runs at 105-215 actions.
# attempt 0 = the real run for every game EXCEPT the 7 games whose attempt 0 finished capped (eval-v2-gemini-redo.yaml
# runs those as attempt 1). Analysis: use the uncapped run per game; capped runs have reason budget_cost at ~$2.
name: eval-v2-gemini
collection: eval-v2
games: all
attempts: 1
concurrency: 12
est_steps_per_game: 300
models:
  - {id: gemini-flash, effort: medium, max_concurrency: 12}
budgets: {max_actions: 400, max_turns: 500, max_cost_usd: 15.00, max_wall_s: 10800}
