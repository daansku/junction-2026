# Smoke test before overnight-dev: 1 game, 1 attempt per model, to catch harness/provider errors cheaply.
# Purpose: shake out the harness on real models, get replays for the UI/deck, and a first gap estimate.
# Uses only the keys on A4's machine (no Anthropic key yet). Results are dev-only and never mix
# with the eval-v1 leaderboard (different collection). See coordination/OVERNIGHT.md.
name: overnight-smoke
collection: dev
games: {first: 1}
attempts: 1
concurrency: 6
est_steps_per_game: 250
models:
  - {id: gemini-flash, effort: medium}
  - {id: nemotron-3-5-super-vl}
  - {id: verda-kimi-k3-1-pro}
  - {id: featherless-open}
  - {id: featherless-gpt-oss-120b}
  - {id: featherless-qwen3-5-9b}
baselines: [random, optimal, noop, stop_early]
budgets: {max_actions: 400, max_turns: 500, max_cost_usd: 1.00, max_wall_s: 2400}
