[project]
name = "arena"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "httpx>=0.27",
    "anthropic>=0.70",
    "openai>=1.50",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arena = ["prompts/*.md"]
