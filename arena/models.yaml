# Model registry (PLAN.md §4.7). Owned by A3.
# Rules: api_model and prices come from provider docs, never memory. `verified: false` entries are
# skipped by the runner until `python -m arena models --check` confirms the id on the live /models
# endpoint (or a human fills it in from the docs). Prices: USD per 1M tokens, null = unknown.
#
