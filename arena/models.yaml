# NVIDIA Nemotron served by Verda (DataCrunch) for the hackathon. Endpoint, model id and limits come
# from the organisers' opencode config (2026-11-14): OpenAI-compatible, key NVIDIA_VERDA_INFERENCE_KEY,
# context 1,048,576, max output 32,768, text + image input, reasoning returned in `reasoning_content`.
# The endpoint answers 404 without a key (also on /v1/models), so `arena models --check` can't list it.
- id: nemotron-3-5-super-vl
  display_name: Nemotron 3.5 Super VL
  provider: verda
  base_url: https://containers.datacrunch.io/nemotron-3-5-super-vl-b300/v1
  api_key_env: NVIDIA_VERDA_INFERENCE_KEY   # own key; VERDA_INFERENCE_KEY is for the other Verda deployment
  api_model: nemotron-3.5-super-vl
  tier: open
  input_modes: [image, rle]
  price_in: null                # hackathon credits, no per-token price published
  price_out: null
  params: "120B MoE (12B active), NVFP4"   # vLLM root: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
  context: 1048576
  max_output: 32768
  link: https://build.nvidia.com/models
  max_concurrency: 3            # Verda endpoint; 1 run ~ 29 s/action measured 03:50
  verified: true                # id from the organisers' config; first real run confirms it

# featherless.ai: OpenAI-compatible, https://api.featherless.ai/v1, key FEATHERLESS_API_KEY.
