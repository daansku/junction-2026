schema_version = "1.1"

[task]
name = "junction-arena/gridworld-s910018-d4-l8-41c953d2"
description = "Unknown grid game; discover the rules by acting; finish every level in few actions."
authors = []
keywords = ["rule-discovery", "games", "arc-agi-3-style", "mcp"]

[metadata]

[verifier]
timeout_sec = 120.0
# Separate container: the agent never shares a filesystem or network namespace with grading.
environment_mode = "separate"

[agent]
timeout_sec = 7200.0
# Egress allowlist while the agent plays: only the game sidecar and model APIs (arena/HARBOR.md, "Network").
# Add your model API host with `harbor run ... --allow-agent-host <host>`.
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "generativelanguage.googleapis.com", "api.openai.com", "openrouter.ai", "inference.verda.com", "containers.datacrunch.io", "api.featherless.ai", "integrate.api.nvidia.com", "api.together.xyz", "api.fireworks.ai", "api.deepseek.com", "api.moonshot.ai", "api.x.ai", "api.mistral.ai"]

[environment]
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 4096
gpus = 0
[[environment.mcp_servers]]
name = "game"
transport = "streamable-http"
url = "http://localhost:8000/mcp"
args = []

[verifier.env]

[environment.env]

[solution.env]

# The game sidecar writes its score here after every action; Harbor collects it after the agent phase
# (agent container already stopped) and places it at the same path in the separate verifier.
[[artifacts]]
source = "/evidence/score.json"
service = "game"
