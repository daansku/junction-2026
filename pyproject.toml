[project]
name = "switchboard"
version = "0.1.0"
description = "Switchboard: a rule-discovery RL environment (AfterQuery @ Junction 2026)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2,<2",
]

[project.optional-dependencies]
llm = ["anthropic", "openai"]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["switchboard"]
