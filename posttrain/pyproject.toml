[project]
name = "posttrain"
version = "0.1.0"
description = "Junction 2026 post-training (A3): SFT v2 ctrl/games/mix and GRPO on engine-verified tasks"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gpu = ["torch", "transformers>=4.57", "peft>=0.13", "accelerate", "datasets", "trl", "vllm"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
