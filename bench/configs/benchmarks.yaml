# Benchmark list for every bench run. Frozen once bench/PROTOCOL.md is approved by the humans.
#
# Version 2 (Sat 14.11 18:00): the PRIMARY suite is the humans' list in FT_BENCHMARKS.md (Daniel, 17:24),
# adopted by human decision over A2's v1 list. reasoning-gym tiers are kept as a labelled SECONDARY tier
# (PLAN.md §3.2 near transfer / logic); they never enter the headline number.
# Task names, shot counts and output types were checked against lm-evaluation-harness 0.4.13 on the Verda box.
#
# kind: lm_eval        -> lm-evaluation-harness; `fewshot` overrides the task default (null = task default)
# kind: reasoning_gym  -> procedurally generated items, fixed seed, graded by reasoning-gym's own score_answer
# limit: max items per (sub)task (lm-eval --limit)
version: 2

tiers:
  primary:
    description: far-transfer suite from FT_BENCHMARKS.md; headline = unweighted mean over these six rows
    headline: true
    benchmarks:
      - {id: bbh, kind: lm_eval, task: bbh_cot_fewshot}                 # all 27 tasks, 3-shot CoT (task default)
      - {id: math, kind: lm_eval, task: minerva_math, fewshot: 0}       # 5,000 items, 0-shot CoT (task default is 4-shot)
      - {id: gsm8k, kind: lm_eval, task: gsm8k_cot}                     # 8-shot CoT (task default)
      - {id: medqa, kind: lm_eval, task: medqa_4options}                # 0-shot, 4 options; loglikelihood multiple choice (only form in lm-eval)
      - {id: mmlu_pro_health, kind: lm_eval, task: mmlu_pro_health}     # 5-shot CoT (task default), full subject
      - {id: mmlu_pro_law, kind: lm_eval, task: mmlu_pro_law}           # 5-shot CoT (task default), full subject

  negative_control:
    description: knowledge recall; must not move. If it rises like the primary suite, the gain is answer formatting, not reasoning
    benchmarks:
      - {id: mmlu_pro_history, kind: lm_eval, task: mmlu_pro_history}   # 5-shot CoT

  # pre-declared BBH subset (FT_BENCHMARKS.md "secondary"): reported from the `bbh` items above, no extra run.
  bbh_subset:
    description: BBH tasks where a gain is most plausible; computed from the bbh run's items
    from: bbh
    subtasks: [tracking_shuffled_objects, navigate, logical_deduction, web_of_lies, temporal_sequences]

  secondary_reasoning_gym:
    description: PLAN §3.2 near-transfer and logic tasks closest to our games (procedural, fresh items from a seed)
    benchmarks:
      - {id: rg_maze, kind: reasoning_gym, dataset: maze, n: 100}
      - {id: rg_sokoban, kind: reasoning_gym, dataset: sokoban, n: 100}
      - {id: rg_rush_hour, kind: reasoning_gym, dataset: rush_hour, n: 100}
      - {id: rg_shortest_path, kind: reasoning_gym, dataset: shortest_path, n: 100}
      - {id: rg_arc_1d, kind: reasoning_gym, dataset: arc_1d, n: 100}
      - {id: rg_zebra_puzzles, kind: reasoning_gym, dataset: zebra_puzzles, n: 100}
      - {id: rg_knights_knaves, kind: reasoning_gym, dataset: knights_knaves, n: 100}

# Intermediate checkpoints (FT_BENCHMARKS.md "if time is short"): a fixed random subsample of the primary suite.
# Implemented as the first N items per (sub)task via lm-eval --limit, the same items for every checkpoint.
dev_slice: [bbh, math, gsm8k, medqa, mmlu_pro_health, mmlu_pro_law, mmlu_pro_history]
dev_slice_limit: 25     # first 25 items per (sub)task: 27 BBH x 25 + 7 MATH x 25 + 25 x 5 others ~ 975 items (FT_BENCHMARKS: ~1,000)
