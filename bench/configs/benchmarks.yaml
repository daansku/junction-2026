# Benchmark list for every bench run. Frozen once bench/PROTOCOL.md is approved by the humans.
#
# Version 4 (Sat 14.11 23:45, human decision): BBH removed from the headline and the dev slice (observed answer-format
# artifact: RL replies drop the 3-shot "So the answer is (X)" phrase, so lm-eval cannot extract the answer). Headline = 5 rows.
#
# Version 3 (Sat 14.11 20:15, human decision): fixed subsample of ~2,250 generative items per model + full MedQA,
# because the full ~17k-item suite takes ~13 h per model on the shared vLLM server. First N items per (sub)task (lm-eval --limit).
#
# Version 2 (Sat 14.11 18:00): the PRIMARY suite is the humans' list in FT_BENCHMARKS.md (Daniel, 17:24),
# adopted by human decision over A2's v1 list. reasoning-gym tiers are kept as a labelled SECONDARY tier
# (near transfer / logic); they never enter the headline number.
# Task names, shot counts and output types were checked against lm-evaluation-harness 0.4.13 on the Verda box.
#
# kind: lm_eval        -> lm-evaluation-harness; `fewshot` overrides the task default (null = task default)
# kind: reasoning_gym  -> procedurally generated items, fixed seed, graded by reasoning-gym's own score_answer
# limit: max items per (sub)task (lm-eval --limit)
version: 4

tiers:
  primary:
    description: far-transfer suite from FT_BENCHMARKS.md minus BBH (v4); headline = unweighted mean over these five rows
    headline: true
    benchmarks:
      # bbh removed in v4 (answer-format artifact, see header); base row still has it in out/base for transparency
      - {id: math, kind: lm_eval, task: minerva_math, fewshot: 0, limit: 50}  # 0-shot CoT (task default 4-shot); 50 per subject x 7 = 350
      - {id: gsm8k, kind: lm_eval, task: gsm8k_cot, limit: 250}         # 8-shot CoT (task default); first 250 of 1,319
      - {id: medqa, kind: lm_eval, task: medqa_4options}                # 0-shot, 4 options, full 1,273; loglikelihood multiple choice (only form in lm-eval; cheap)
      - {id: mmlu_pro_health, kind: lm_eval, task: mmlu_pro_health, limit: 100}  # 5-shot CoT (task default)
      - {id: mmlu_pro_law, kind: lm_eval, task: mmlu_pro_law, limit: 100}        # 5-shot CoT (task default)

  negative_control:
    description: knowledge recall; must not move. If it rises like the primary suite, the gain is answer formatting, not reasoning
    benchmarks:
      - {id: mmlu_pro_history, kind: lm_eval, task: mmlu_pro_history, limit: 100}  # 5-shot CoT

  # pre-declared BBH subset: removed with BBH in v4

  secondary_reasoning_gym:
    description: near-transfer and logic tasks closest to our games (procedural, fresh items from a seed)
    benchmarks:
      - {id: rg_maze, kind: reasoning_gym, dataset: maze, n: 100}
      - {id: rg_sokoban, kind: reasoning_gym, dataset: sokoban, n: 100}
      - {id: rg_rush_hour, kind: reasoning_gym, dataset: rush_hour, n: 100}
      - {id: rg_shortest_path, kind: reasoning_gym, dataset: shortest_path, n: 100}
      - {id: rg_arc_1d, kind: reasoning_gym, dataset: arc_1d, n: 100}
      - {id: rg_zebra_puzzles, kind: reasoning_gym, dataset: zebra_puzzles, n: 100}
      - {id: rg_knights_knaves, kind: reasoning_gym, dataset: knights_knaves, n: 100}

# Intermediate checkpoints (FT_BENCHMARKS.md "if time is short"): a fixed random subsample of the primary suite.
# Implemented as the first N items per (sub)task via lm-eval --limit, the same items for every checkpoint.
dev_slice: [math, gsm8k, medqa, mmlu_pro_health, mmlu_pro_law, mmlu_pro_history]
dev_slice_limit: 25     # first 25 items per (sub)task: 7 MATH x 25 + 25 x 5 others = 300 items (v4: BBH removed)
