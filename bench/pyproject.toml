[project]
name = "bench"
version = "0.1.0"
description = "Reasoning-benchmark pipeline: one command scores any model on a fixed benchmark list with identical settings"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
# GPU side only (the Verda box); the stats/compare half runs anywhere
gpu = ["vllm==0.33.0", "lm-eval[ifeval,math]", "reasoning-gym", "datasets", "huggingface_hub"]
dev = ["pytest"]

[project.scripts]
bench = "bench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
